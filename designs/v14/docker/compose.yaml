# Solver containers for designs/v14. Run from the repository root, for example:
#   docker compose -f designs/v14/docker/compose.yaml build ccx
#   docker compose -f designs/v14/docker/compose.yaml run --rm -w /work/ccx/fine_pressure ccx vertical_1g
#   docker compose -f designs/v14/docker/compose.yaml run --rm -w /work/openfoam/cases/stand_q1p0 openfoam -lc "source /usr/lib/openfoam/openfoam2412/etc/bashrc && simpleFoam"
#   docker compose -f designs/v14/docker/compose.yaml run --rm tools python designs/v14/source/veil_v14.py designs/v14/output
# designs/v14/source/run_ccx.sh and designs/v14/openfoam/run_case.sh wrap the first two.
services:
  ccx:
    build: { context: .., dockerfile: docker/Dockerfile.ccx }
    image: veil-ccx
    volumes: [ "..:/work" ]
    environment:
      OMP_NUM_THREADS: "2"
      CCX_NPROC_EQUATION_SOLVER: "1"   # multi-threaded SPOOLES returned wrong, unbalanced solutions
  openfoam:
    image: opencfd/openfoam-default:2412
    entrypoint: ["bash"]
    volumes: [ "..:/work" ]
    environment:
      OMPI_ALLOW_RUN_AS_ROOT: "1"
      OMPI_ALLOW_RUN_AS_ROOT_CONFIRM: "1"
  tools:
    build: { context: .., dockerfile: docker/Dockerfile.tools }
    image: veil-tools
    volumes: [ "../../..:/repo" ]
